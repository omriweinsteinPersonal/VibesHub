  - expo-asset@57.0.9 || 57.0.19 || 57.0.20
  - expo-file-system@57.0.2
  - expo-modules-core@57.0.10 || 57.0.21 || 57.0.22 || 57.0.23 || 57.0.24
  - expo-router@57.0.11 || 57.0.25 || 57.0.26 || 57.0.27 || 57.0.28 || 57.0.29
