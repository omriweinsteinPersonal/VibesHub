  '@xmldom/xmldom@0.9': 0.9.12
  brace-expansion@5: 5.0.12
  compression@1: 1.8.2
  fast-uri@3: 3.1.8
  fast-uri@4: 4.2.1
  fastify: 5.12.5
  find-my-way: 9.9.0
  js-yaml@4: 4.3.2
  node-forge@1: 1.4.1
  shell-quote: 1.12.0
  source-map-js@1: 1.2.2
  zod@4: 4.6.6

allowBuilds:
