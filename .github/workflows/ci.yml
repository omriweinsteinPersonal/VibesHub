name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level critical

      - name: Check formatting
        run: pnpm format:check

      - name: Lint, type-check, and test
        run: pnpm check

      - name: Build all applications and packages
        run: pnpm build

      - name: Validate native release configuration
        run: pnpm mobile:release:check

      - name: Validate production mobile environment guard
        env:
          EAS_BUILD_PROFILE: production
          EXPO_PUBLIC_API_URL: https://api.swavii.com
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
        run: pnpm --filter @vibeshub/mobile validate:build-env

      - name: Check Expo native project health
        run: pnpm dlx expo-doctor@latest apps/mobile

      - name: Bundle native applications
        shell: bash
        run: |
          output_dir="$(mktemp -d)"
          trap 'rm -rf "$output_dir"' EXIT
          pnpm --filter @vibeshub/mobile exec expo export --platform ios --output-dir "$output_dir/ios"
          pnpm --filter @vibeshub/mobile exec expo export --platform android --output-dir "$output_dir/android"
