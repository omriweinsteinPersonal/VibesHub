    selected: true
- tapOn: Add brand
- assertVisible:
    text: Add brand
    selected: true
- assertVisible:
    text: Add item
    selected: false
- takeScreenshot: dashboard-brand
- tapOn: Add collection
- assertVisible:
    text: Add collection
    selected: true
- assertVisible:
    text: Add brand
    selected: false
- tapOn: Add carousel
- assertVisible:
    text: Add carousel
    selected: true
- assertVisible:
    text: Add collection
    selected: false
- tapOn: Add discount
- assertVisible:
    text: Add discount
    selected: true
- assertVisible:
    text: Add carousel
    selected: false
- takeScreenshot: dashboard-discount
- tapOn: Home tab
- tapOn: Dashboard tab
- assertVisible:
    text: Add discount
    selected: false
